<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0BB6C4" />
  <title>GO HEALTH 健康小學堂</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="brand-header">
      <div class="brand-wordmark" aria-label="GO HEALTH">GO <span>HEALTH</span></div>
      <div class="brand-dot" aria-hidden="true"></div>
    </header>

    <section id="intro-screen" class="screen active" aria-labelledby="intro-title">
      <div class="hero-card">
        <div class="eyebrow">GO HEALTH 健康小學堂</div>
        <h1 id="intro-title">今天一起學 5 個健康小知識</h1>
        <p>每題都有小提示與解題小卡。答對後就能繼續下一題，輕鬆學、慢慢記。</p>
        <div class="hero-pills" aria-label="玩法說明">
          <span>5 題</span><span>4 選 1</span><span>答對再前進</span>
        </div>
        <button id="start-btn" class="btn btn-primary btn-block">開始挑戰</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen" aria-live="polite">
      <div class="quiz-topbar">
        <button id="quit-btn" class="icon-btn" aria-label="回到開始頁">←</button>
        <div class="progress-wrap">
          <div class="progress-label"><span id="progress-text">1 / 5</span><span id="category-text"></span></div>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </div>
      </div>

      <article class="question-card">
        <div class="question-number" id="question-number">第 1 題</div>
        <h2 id="question-text">題目載入中</h2>
        <div id="options" class="options" role="group" aria-label="作答選項"></div>
        <div id="hint-box" class="hint-box" hidden>
          <strong>給你一個小提示</strong>
          <p id="hint-text"></p>
        </div>
      </article>

      <section id="answer-card" class="answer-card" hidden>
        <div class="answer-badge">答對了！</div>
        <h3 id="explanation-title">一起記住這個重點</h3>
        <p id="explanation-body"></p>
        <div class="takeaway-box">
          <span>記住這一點</span>
          <strong id="takeaway-text"></strong>
        </div>
        <button id="next-btn" class="btn btn-primary btn-block">下一題</button>
      </section>
    </section>
  </main>

  <script src="data/questions.js"></script>
  <script src="js/quiz-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
